name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不使用 android-actions/setup-android：该 action 在检测到预装 sdkmanager
      # 版本不符时会自行下载新版 cmdline-tools，再调用 sdkmanager --licenses，
      # 而那条调用没有喂入输入，CI 会一直停在 "Accept? (y/N)" 上。
      # GitHub 的 ubuntu runner 本身已带完整 Android SDK，直接用即可。
      - name: Install Android SDK components
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set; runner image layout changed." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"

          # 许可需要显式应答。yes 被 sdkmanager 关闭管道后会以 141 退出，
          # 在 pipefail 下会让整条流水线失败，因此用 || true 兜住。
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # sdkmanager 会给每个包打进度条，日志会被撑爆；
          # 只在失败时才输出，成功路径保持安静。
          if ! "$SDKMANAGER" --install \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "platform-tools" > /tmp/sdk-install.log 2>&1; then
            echo "--- sdkmanager failed ---"
            cat /tmp/sdk-install.log
            exit 1
          fi
          echo "SDK components ready."

      # 仓库中未提交 gradlew/gradle-wrapper.jar（二进制），
      # 因此直接用 setup-gradle 安装的 Gradle 8.9，而不是 ./gradlew。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        if: success()
        run: find app/build/outputs -name "*.apk" -type f -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: papertong-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
